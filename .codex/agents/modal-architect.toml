   - Fix: [Solution]\r
\r
✅ Verdict: Approved / Needs Fixes\r
```\r
\r
---\r
\r
## When to Invoke\r
\r
- UI Request: "Create a modal for X", "Fix modal styles"\r
- Refactoring: "Move dialog to central module"\r
- Design Check: "Why does this modal look different?""""
